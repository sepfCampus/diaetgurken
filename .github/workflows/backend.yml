name: Backend Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dependencies installieren
        run: |
          cd backend
          npm ci

      - name: Prisma Client generieren
        run: |
          cd backend
          npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Datenbank migrieren
        run: |
          cd backend
          npx prisma migrate deploy
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Tests ausführen
        run: |
          cd backend
          npm test
        env:
          DATABASE_URL: "file:./dev.db"